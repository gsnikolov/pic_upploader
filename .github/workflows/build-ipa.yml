name: Build unsigned IPA

# Builds an UNSIGNED .ipa on a GitHub macOS runner.
# SideStore re-signs it on the iPhone with a free Apple ID.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT_DIR: CameraAccess
      SCHEME: CameraAccess
      APP_NAME: CameraAccess
      IPA_NAME: GlassesToDrive.ipa
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (needs 26.4+ for Swift 6.3)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME"

      - name: Build (unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          # Optional, only needed for Phase 3 (Inputs / capture button).
          # Empty values keep Developer Mode behaviour (no attestation).
          META_APP_ID: ${{ secrets.META_APP_ID }}
          CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            META_APP_ID="${META_APP_ID:-0}" \
            CLIENT_TOKEN="${CLIENT_TOKEN:-}" \
            | tee build.log | grep -E "error:|warning: .*Sendable|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log

      - name: Package IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$IPA_NAME" Payload
          ls -la "$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.PROJECT_DIR }}/${{ env.IPA_NAME }}

      # Rolling "latest" release on main, so the .ipa has a stable URL that
      # can be opened directly on the iPhone and shared to SideStore.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build (${{ github.sha }})
          prerelease: true
          make_latest: false
          files: ${{ env.PROJECT_DIR }}/${{ env.IPA_NAME }}
